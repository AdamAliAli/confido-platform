events { worker_connections 1024; }
http {
  upstream web_pool { least_conn; server web:3000; }
  upstream api_pool { least_conn; server api:4000; }
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  server {
    listen 80;
    location /api/ { limit_req zone=api_limit burst=40 nodelay; proxy_pass http://api_pool; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { proxy_pass http://web_pool; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  }
}
